name: Chennai News Monitor

on:
  schedule:
    # Runs every 15 minutes (actual timing depends on GitHub load)
    - cron: "*/15 * * * *"
  # Allow manual trigger for testing
  workflow_dispatch:

# Needed to push state changes back to repo
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history needed for clean pushes
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit state changes
        if: success()
        run: |
          if [ -f .state_changed ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add chennai_reddit_state.json
            git diff --staged --quiet || git commit -m "chore: update seen posts state"
            git push
          fi
